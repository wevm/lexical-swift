# The demo app: LexicalEditor on the demo document, for trying the editor on
# a device or the simulator and for the UI tests. Generate the Xcode project
# with `xcodegen generate` (it is not checked in); signing takes
# DEVELOPMENT_TEAM from the xcodebuild command line, never from this file.
name: LexicalDemo
options:
  bundleIdPrefix: dev.lexical.swift
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
packages:
  Lexical:
    path: ../..
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    LEXICAL_BUNDLE_PREFIX: dev.lexical.swift
targets:
  LexicalDemo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LEXICAL_BUNDLE_PREFIX).demo
        INFOPLIST_KEY_CFBundleDisplayName: Lexical
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    dependencies:
      - package: Lexical
        product: Lexical
      - package: Lexical
        product: LexicalExtension
      - package: Lexical
        product: LexicalHistory
      - package: Lexical
        product: LexicalRichText
      - package: Lexical
        product: LexicalSwiftUI
  LexicalDemoUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LEXICAL_BUNDLE_PREFIX).demo.uitests
    dependencies:
      - target: LexicalDemo
schemes:
  LexicalDemo:
    build:
      targets:
        LexicalDemo: all
        LexicalDemoUITests: [test]
    test:
      targets: [LexicalDemoUITests]
