# Lets wevm/lexical's Swift Release workflow (main, swift-release environment)
# push the subtree split of swift/ and its release tags to this mirror, and
# create the matching GitHub release.
# Lives in wevm/lexical under swift/ so each mirror push publishes it here.
subject: repo:wevm@109633172/lexical@1443802185:environment:swift-release
claim_pattern:
  ref: refs/heads/main
  workflow_ref: 'wevm/lexical/\.github/workflows/swift-release\.yml@refs/heads/main'
permissions:
  contents: write
max_ttl: 5m
