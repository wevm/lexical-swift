# The Swift playground: the editor with a toolbar, the tree view, JSON,
# HTML and Markdown import and export and debug settings, laid out like the
# upstream playground (packages/lexical-playground). Generate the Xcode
# project with `xcodegen generate` (it is not checked in); signing takes
# DEVELOPMENT_TEAM from the xcodebuild command line, never from this file.
name: LexicalPlayground
options:
  bundleIdPrefix: dev.lexical.swift
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
packages:
  Lexical:
    path: ../..
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    LEXICAL_BUNDLE_PREFIX: dev.lexical.swift
targets:
  LexicalPlayground:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
        excludes: [katex]
      # KaTeX, kept as a folder so its page, script and fonts keep their
      # relative paths.
      - path: Sources/katex
        type: folder
        buildPhase: resources
      # The app icon, an Icon Composer document written by
      # scripts/make-app-icon.py; actool compiles it for iOS and macOS.
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LEXICAL_BUNDLE_PREFIX).playground
        INFOPLIST_KEY_CFBundleDisplayName: Lexical Playground
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    dependencies:
      - package: Lexical
        product: Lexical
      - package: Lexical
        product: LexicalA11y
      - package: Lexical
        product: LexicalAppKit
      - package: Lexical
        product: LexicalAutoEmbed
      - package: Lexical
        product: LexicalCodeCore
      - package: Lexical
        product: LexicalCodeTreeSitter
      - package: Lexical
        product: LexicalCodeTreeSitterBash
      - package: Lexical
        product: LexicalCodeTreeSitterCSS
      - package: Lexical
        product: LexicalCodeTreeSitterGo
      - package: Lexical
        product: LexicalCodeTreeSitterHTML
      - package: Lexical
        product: LexicalCodeTreeSitterJavaScript
      - package: Lexical
        product: LexicalCodeTreeSitterJSON
      - package: Lexical
        product: LexicalCodeTreeSitterPython
      - package: Lexical
        product: LexicalCodeTreeSitterRust
      - package: Lexical
        product: LexicalCodeTreeSitterSwift
      - package: Lexical
        product: LexicalCodeTreeSitterTypeScript
      - package: Lexical
        product: LexicalCodeTreeSitterC
      - package: Lexical
        product: LexicalCodeTreeSitterCPP
      - package: Lexical
        product: LexicalCodeTreeSitterJava
      - package: Lexical
        product: LexicalCodeTreeSitterMarkdown
      - package: Lexical
        product: LexicalCodeTreeSitterObjC
      - package: Lexical
        product: LexicalCodeTreeSitterPowerShell
      - package: Lexical
        product: LexicalCodeTreeSitterSQL
      - package: Lexical
        product: LexicalCodeTreeSitterXML
      - package: Lexical
        product: LexicalDecoratorBlockNode
      - package: Lexical
        product: LexicalDevtoolsCore
      - package: Lexical
        product: LexicalExtension
      - package: Lexical
        product: LexicalHashtag
      - package: Lexical
        product: LexicalHistory
      - package: Lexical
        product: LexicalHTML
      - package: Lexical
        product: LexicalLink
      - package: Lexical
        product: LexicalList
      - package: Lexical
        product: LexicalMarkdown
      - package: Lexical
        product: LexicalMark
      - package: Lexical
        product: LexicalFile
      - package: Lexical
        product: LexicalMenu
      - package: Lexical
        product: LexicalOverflow
      - package: Lexical
        product: LexicalPlainText
      - package: Lexical
        product: LexicalRichText
      - package: Lexical
        product: LexicalSelection
      - package: Lexical
        product: LexicalSwiftUI
      - package: Lexical
        product: LexicalText
      - package: Lexical
        product: LexicalTextKit
      - package: Lexical
        product: LexicalUIKit
      - package: Lexical
        product: LexicalUtils
  LexicalPlaygroundUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LEXICAL_BUNDLE_PREFIX).playground.uitests
    dependencies:
      - target: LexicalPlayground
  LexicalPlaygroundMacUITests:
    type: bundle.ui-testing
    supportedDestinations: [macOS]
    sources: [MacUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LEXICAL_BUNDLE_PREFIX).playground.macuitests
    dependencies:
      - target: LexicalPlayground
  LexicalPlaygroundTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies:
      - target: LexicalPlayground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LEXICAL_BUNDLE_PREFIX).playground.tests
        # XcodeGen writes the iOS host path for a multiplatform app.
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/LexicalPlayground.app/Contents/MacOS/LexicalPlayground
schemes:
  LexicalPlayground:
    build:
      targets:
        LexicalPlayground: all
        LexicalPlaygroundUITests: [test]
        LexicalPlaygroundTests: [test]
    test:
      targets: [LexicalPlaygroundTests, LexicalPlaygroundUITests]
  # The macOS UI tests, in their own scheme: an iOS test run of the one
  # above must not build them.
  LexicalPlaygroundMac:
    build:
      targets:
        LexicalPlayground: all
        LexicalPlaygroundMacUITests: [test]
    test:
      targets: [LexicalPlaygroundMacUITests]
